[project]
name = "adcp-emit"
version = "0.0.0"
description = "Emit the AdCP SDK types from the schema bundle."
# The FLOOR is 3.11 because D2 makes an `enum` node a `StrEnum`, which is 3.11.
# The alternative, `class X(str, Enum)`, gives a member whose `str()` is
# "MatchType.BROAD" rather than "broad", which is not what a wire type means by
# being a string -- so the floor moves rather than the decision. Reversible in
# this one line if D2 is re-decided.
#
# Capped because the two pins have to hold together: `datamodel-code-generator`
# requires `pydantic>=2.14` on 3.15 and up, and the pydantic pin below is exact
# to a minor because the rendered annotation and the error shape are both a
# function of it. 3.15 is unreleased; the cap is lifted by moving the pydantic
# pin, not by floating the compiler.
requires-python = ">=3.11,<3.15"
dependencies = [
    # The harness grades a (JSON Schema document, Python class) pair. These four
    # are everything it imports, and the emitter adds nothing to them.
    "pydantic>=2.13.0,<2.14",
    "jsonschema>=4.20.0",
    # `jsonschema` asserts NOTHING for a draft-07 `format` unless its checker for
    # that format is installed, and D5 lets a format select a Python type only
    # where the schema half asserts it.  These two are what make the bundle's
    # formats checkable: `rfc3339-validator` registers `date-time` (and `time`)
    # and `rfc3987` registers `uri` (and `uri-reference`, `iri`,
    # `iri-reference`); `date`, `email`, `idn-email`, `ipv4`, `ipv6` and `regex`
    # come with `jsonschema` itself.  Runtime dependencies and not dev ones,
    # because `strict_validate` is what decides acceptance (D4): without them a
    # deployed SDK accepts a `date-time` with no offset and an `AwareDatetime`
    # field would then be narrower than the document it names.  Measured on the
    # 1,054 portable documents of the 3.2 bundle, they move `date-time` (437
    # uses) and `uri` (300) from ungraded to graded, which is 737 of 806.
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
    # D10: the compiler. `f(schemas, pinned compiler)` has two arguments and this
    # is the second, so it is pinned exactly rather than floated -- the rendered
    # text is a function of the version, and the byte compare in `test_emit` is
    # stated over one. Driven through its pydantic-v2 MODEL layer only; its
    # parser never runs (`codegen/compiler.py`).
    "datamodel-code-generator==0.86.0",
    # Pinned exactly. A hypothesis example stream is a function of the version:
    # the same control pair measured 30/40 at 6.98.0, 24 at 6.112.0, 25 at
    # 6.125.0, 28 at 6.140.0 and 6.168.5, 20 at 6.170.5. 6.169.0 raises the
    # floor to Python 3.11, above requires-python here.
    "hypothesis==6.168.5",
    "hypothesis-jsonschema==0.23.1",
]

[project.optional-dependencies]
# ``pytest-xdist`` is pinned like the other test-time pins above, because it
# decides how many processes grade the population and a floating major could
# change that silently.
dev = ["pytest>=7.0.0", "pytest-xdist==3.8.0"]

[build-system]
# The emitted tree is a package, not a directory of files: the step-1 outcome is
# that `from adcp.types._schemas.core.pagination_request import PaginationRequest`
# works, and an uninstalled project makes that conditional on PYTHONPATH.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The schema documents are not documentation of the build: `strict_validate`
# reads the one its own class names (`__adcp_schema__`) to decide acceptance
# (D4). A wheel without them imports and then raises on the first validation,
# which is the one failure mode a test run from the source tree cannot see. One
# file per document, named by the document's own bundle-relative path, so the
# read is of that document and never of a table.
[tool.setuptools.package-data]
"adcp.types._schemas" = ["*.json", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# EVERY RUN IS PARALLEL, because the expensive part of this suite is one
# ``check_pair`` per emitted pair and those are independent of each other.
# Measured on the same tree, same pins, same bundle: 1,070 s serial against
# 366 s at ten workers, 2.9x, with the SAME verdict -- three failures, the same
# three by name. A faster suite that grades something else would not be faster,
# so the identity of the failure set is the thing to check if this ever changes.
#
# ``auto`` scales down on a smaller machine and ``--maxprocesses`` caps it,
# because MEMORY and not CPU is this suite's ceiling: each worker imports the
# whole emitted tree and builds hypothesis strategies, and runs here have been
# killed by the OOM killer at fifteen Python processes against 5 GB of swap.
# Ten is the measured-stable figure WITH a lane's own suite running beside it,
# which is the normal case during an epic. Override upward on an idle machine
# with ``-n 14``; a single test still runs alone under ``-n 0``.
addopts = "-n auto --maxprocesses=10"

# --------------------------------------------------------------------------- #
# the type checker, which section 14 step 6 makes the TEST for the decision layer
# --------------------------------------------------------------------------- #
# ``docs/plan/architecture.md`` section 14 step 6: "``Refusal`` stops subclassing
# ``Exception``; every handler returns ``Lowering | Refusal`` ... The type checker is the
# test."  Section 2 says what it tests: "The type checker therefore refuses a caller
# that reads a ``Lowering`` field off a result without handling the ``Refusal`` branch,
# which is the mechanical form of the semantics document's section 9 rule that a crash
# is not an outcome."  So the gate is a checker running CLEAN over the decision layer,
# and this section is what makes "clean" reproducible -- the files it ranges over and
# the two things it is allowed not to know.
#
# ``files`` is the DECISION LAYER and the two ends section 2 puts the effects at, and it
# is listed rather than left to default to ``codegen/`` for one reason: ``harness.py``
# is the VERIFIER, which section 9 keeps separate from the walk, and it carries 29
# pre-existing errors against ``hypothesis.settings`` and ``jsonschema``'s untyped
# surface that are not this layer's and would make the gate unreadable.  A row that
# brings the verifier under the checker adds it here; the list may GROW and may not
# shrink.
#
# ``mypy`` is not a dependency of this project and is not pinned: a checker is an
# instrument and the artifact does not depend on it, so ``tests/test_type_checker.py``
# skips where it is absent and GRADES where it is present.  Run it directly with
#
#     PYTHONPATH=.:src uv run --no-sync python -m mypy
#
# which reads this section and needs no arguments.
[tool.mypy]
files = [
    "codegen/refusal.py",
    "codegen/keywords.py",
    "codegen/ir.py",
    "codegen/bundle.py",
    "codegen/schema",
    "codegen/lower",
    "codegen/compiler.py",
    "codegen/emit.py",
    "codegen/constraints.py",
    "codegen/render.py",
    "codegen/dump_exemptions.py",
    "codegen/__main__.py",
]

# The two things the checker is allowed not to know, both of them a MISSING TYPE
# SURFACE and neither a silenced error of ours.  Per module and never blanket, so a
# genuine unresolved import inside ``codegen`` is still an error: an inline
# ``type: ignore`` is what step 6 forbids, and a scoped statement about a third party's
# stubs is not one.
#
# * ``adcp.*`` is this project's own runtime package and ships no ``py.typed``.  Adding
#   one is a change to the WHEEL's public surface -- it promises every annotation in
#   ``src/adcp`` to every consumer's checker -- so it is a decision for the row that
#   owns the shipped package and not a side effect of this one.
# * ``jsonschema`` ships no stubs (``types-jsonschema`` is a separate distribution).
[[tool.mypy.overrides]]
module = ["adcp.*", "jsonschema.*"]
ignore_missing_imports = true
follow_untyped_imports = false
