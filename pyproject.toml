[project]
name = "adcp-emit"
version = "0.0.0"
description = "Emit the AdCP SDK types from the schema bundle."
# The FLOOR is 3.11 because D2 makes an `enum` node a `StrEnum`, which is 3.11.
# The alternative, `class X(str, Enum)`, gives a member whose `str()` is
# "MatchType.BROAD" rather than "broad", which is not what a wire type means by
# being a string -- so the floor moves rather than the decision. Reversible in
# this one line if D2 is re-decided.
#
# Capped because the two pins have to hold together: `datamodel-code-generator`
# requires `pydantic>=2.14` on 3.15 and up, and the pydantic pin below is exact
# to a minor because the rendered annotation and the error shape are both a
# function of it. 3.15 is unreleased; the cap is lifted by moving the pydantic
# pin, not by floating the compiler.
requires-python = ">=3.11,<3.15"
dependencies = [
    # The harness grades a (JSON Schema document, Python class) pair. These four
    # are everything it imports, and the emitter adds nothing to them.
    "pydantic>=2.13.0,<2.14",
    "jsonschema>=4.20.0",
    # `jsonschema` asserts NOTHING for a draft-07 `format` unless its checker for
    # that format is installed, and D5 lets a format select a Python type only
    # where the schema half asserts it.  These two are what make the bundle's
    # formats checkable: `rfc3339-validator` registers `date-time` (and `time`)
    # and `rfc3987` registers `uri` (and `uri-reference`, `iri`,
    # `iri-reference`); `date`, `email`, `idn-email`, `ipv4`, `ipv6` and `regex`
    # come with `jsonschema` itself.  Runtime dependencies and not dev ones,
    # because `strict_validate` is what decides acceptance (D4): without them a
    # deployed SDK accepts a `date-time` with no offset and an `AwareDatetime`
    # field would then be narrower than the document it names.  Measured on the
    # 1,054 portable documents of the 3.2 bundle, they move `date-time` (437
    # uses) and `uri` (300) from ungraded to graded, which is 737 of 806.
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
    # D10: the compiler. `f(schemas, pinned compiler)` has two arguments and this
    # is the second, so it is pinned exactly rather than floated -- the rendered
    # text is a function of the version, and the byte compare in `test_emit` is
    # stated over one. Driven through its pydantic-v2 MODEL layer only; its
    # parser never runs (`codegen/compiler.py`).
    "datamodel-code-generator==0.86.0",
    # Pinned exactly. A hypothesis example stream is a function of the version:
    # the same control pair measured 30/40 at 6.98.0, 24 at 6.112.0, 25 at
    # 6.125.0, 28 at 6.140.0 and 6.168.5, 20 at 6.170.5. 6.169.0 raises the
    # floor to Python 3.11, above requires-python here.
    "hypothesis==6.168.5",
    "hypothesis-jsonschema==0.23.1",
]

[project.optional-dependencies]
# ``pytest-xdist`` is pinned like the other test-time pins above, because it
# decides how many processes grade the population and a floating major could
# change that silently.
dev = ["pytest>=7.0.0", "pytest-xdist==3.8.0"]

[build-system]
# The emitted tree is a package, not a directory of files: the step-1 outcome is
# that `from adcp.types._schemas.core.pagination_request import PaginationRequest`
# works, and an uninstalled project makes that conditional on PYTHONPATH.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The schema documents are not documentation of the build: `strict_validate`
# reads the one its own class names (`__adcp_schema__`) to decide acceptance
# (D4). A wheel without them imports and then raises on the first validation,
# which is the one failure mode a test run from the source tree cannot see. One
# file per document, named by the document's own bundle-relative path, so the
# read is of that document and never of a table.
[tool.setuptools.package-data]
"adcp.types._schemas" = ["*.json", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# EVERY RUN IS PARALLEL, because the expensive part of this suite is one
# ``check_pair`` per emitted pair and those are independent of each other.
# Measured on the same tree, same pins, same bundle: 1,070 s serial against
# 366 s at ten workers, 2.9x, with the SAME verdict -- three failures, the same
# three by name. A faster suite that grades something else would not be faster,
# so the identity of the failure set is the thing to check if this ever changes.
#
# **THAT PAIR IS KEPT AS A RATIO AND IS STALE AS AN ABSOLUTE.**  The emitted set has
# grown eleven-fold in wall clock since it was taken while the passing count grew 4%
# (``adcp-client-python-10l.31``'s note carries the curve), and the figures below are the
# current ones. No serial figure is restated beside them because none was taken: a serial
# run of this suite is the 17,061 s of worker time the last row of the table reports.
#
# **MEMORY IS THIS SUITE'S OTHER CEILING, AND THE FIGURE THAT SAID OTHERWISE WAS A
# READING OF A SMALLER TREE.**  What stood here was "memory is not this suite's ceiling
# and the OOM figure does not reproduce", over a ``-n 24`` measurement taken at
# ``adcp-client-python-10l.31``: 10.35 GB resident across all 25 processes at once,
# 1,211 MB in the worst worker, 331 MB median, against 88 GB available.  **Re-measured at
# ``-n 10`` on 2026-10-30 (``adcp-client-python-3be.18``), over the tree whose wall clock
# the table below reports: 93.7 GB resident across 11 processes at once, 14,521 MB in the
# worst worker, 11,393 MB median** -- 1,253 samples at 5 s, sampler attached BEFORE pytest.
# Summed, 9.1x the figure it replaces; in the MEDIAN worker, 34x.
# The old reading was not wrong when it was taken and it is not a reading of this suite:
# it predates the emitted set the paragraph above already calls an eleven-fold growth in
# wall clock, and what grew is the thing that holds the memory -- ``check_accepts`` over a
# RESOLVED schema, which for ``media-buy/get-media-buy-delivery-response.json#`` is
# 2,701,506 bytes and 1,846.8 s of one worker.  So a cap set to protect memory now
# protects something, which is the opposite of what this paragraph used to conclude.
#
# **ATTACH THE SAMPLER BEFORE PYTEST, because a late sample is a FLOOR and reads like a
# peak.**  A second run of the same suite was sampled only from 3 h 15 m in, and its
# largest per-sample sum ROSE monotonically for as long as it was watched -- 70.4 GB after
# 18 minutes of sampling, 77.9 GB after 25, 86.3 GB after 33, all of them "the peak" at the
# moment they were read and all of them under the 93.7 GB a run watched from the start
# reports.  The three numbers of that curve are kept here as the shape of the mistake, not
# as readings of anything.  If a figure has to be cited off a late sample, cite it as
# "at least".
#
# **AND THE RUN WATCHED FROM THE START DID NOT SURVIVE EITHER.**  MemAvailable reached
# **1.0 GB of 125** and the kernel took two workers -- ``gw4`` at 1 h 37 m and ``gw0`` at
# 2 h 05 m, ``oom_kill`` 50 -> 52, each one a ``node down: Not properly terminated`` in the
# log and each one restarted by xdist with its queue re-dispatched.
# Moving the scratch to disk removes the tmpfs term below and does NOT remove this one:
# the dominant term is worker RSS, the median worker is 11.4 GB, and ten of those plus a
# master do not fit beside anything else on this box.  So the honest statement of the
# ceiling is that the suite at ``-n 10`` needs the machine to itself, and the next measured
# step is whether a lower ``--maxprocesses`` trades wall clock for a run that completes --
# not a figure this file can assert without taking it.
#
# **HOW TO RE-DERIVE IT -- and state the reading WITH this derivation, never the figure
# alone**, which is what let the paragraph above go an order of magnitude stale while
# every lane read it:
#
#     out=/srv/ws/.adcp-measure/$(date +%s)        # a DISK path; see SCRATCH below
#     mkdir -p "$out"
#     PYTHONPATH=.:src ./.venv/bin/python -m pytest tests/ -p no:randomly -v -rf \
#         --durations=25 --junitxml="$out/run.xml" > "$out/run.log" 2>&1 &
#     ./rss_sampler.sh "$out/rss.txt" "$!" &                 # the MASTER's pid
#     ./.venv/bin/python suite_report.py "$out/run.log" "$out/run.xml" "$out/rss.txt"
#
# ``rss_sampler.sh`` takes the figure and ``suite_report.py`` reduces it to the two the
# ceiling question needs: ``PEAK RSS per process`` decides whether ONE worker can be
# killed on its own, and ``PEAK CONCURRENT TOTAL`` -- the per-SAMPLE sum, not the sum of
# the per-process peaks -- is the only one the kernel acts on.  The sampler is given the
# master's pid and walks its descendants, because the form that summed every ``.venv``
# process on the box could not be read during an epic, which is when it is read.
# ``/proc/vmstat``'s ``oom_kill`` counter, read before and after, is what says whether a
# run survived -- and it is the only thing that does, because ``pytest-xdist`` RESTARTS a
# killed worker (see ``--max-worker-restart`` below) and the summary line says nothing
# about it.  Both runs of 2026-10-30 are readable only through that counter: the
# late-sampled one went **49 -> 50 at the moment it exited**, after 3 h 53 m, with six of
# its ten workers already in state ``Z`` and six replacements spawned from 1 h 10 m onward;
# the sampled-from-the-start one went **50 -> 52**, at 1 h 37 m and again at 2 h 05 m, and
# kept running on replacements.  Neither run reports any of it.  That is the third and
# fourth attempt at the wall clock below to meet the kernel rather than anything in the
# code, and a lane that reads only the summary line will record the fourth as a success.
#
# **AND THE SCRATCH IS A SECOND CLAIM ON THE SAME RAM, which no RSS figure shows.**
# ``/tmp`` on this box is a 63 GB TMPFS, so a byte written there is a byte of RAM that is
# in NO process's RSS -- the two readings add, and a ceiling computed from either alone is
# wrong by the other.  Measured during the late-sampled run: 86.3 GB of resident workers
# beside 23 GB in ``/tmp``, against 125 GB total, with MemAvailable at 13.4 GB and SwapFree
# at **4 kB** of 3 GB.  10.2 GB of that tmpfs was orphaned scratch from torn-down lanes with
# ZERO open handles -- checked, then removed, which returned MemAvailable to 16.5 GB and
# SwapFree to 87 MB without touching the run.  **That 10.2 GB was larger than the headroom
# the run had left**: MemAvailable still reached 6.1 GB afterwards, so without the reclaim
# the same run would have met the kernel again, which is the sense in which orphaned
# scratch on a tmpfs is not free.  ``tests/conftest.py``'s ``SCRATCH`` keeps
# the suite's own share of that off a memory-backed filesystem and
# ``tests/test_scratch_is_on_disk.py`` reads it back off ``/proc/mounts``;
# ``docs/plan/architecture.md`` ("The suite's scratch goes on DISK, not in RAM",
# 2026-10-30) is the decision.  Read back AFTER it, and the cleanest reading was an
# accident of timing: during the sampled run above, ANOTHER lane's suite without this fix
# put **835,248 kB** into ``/tmp`` while this one put **836,064 kB** of the same package on
# ``/dev/md2``, and this run's own share of ``/tmp`` never exceeded **228 kB**.  Before the
# fix a run's basetemp in ``/tmp`` was **828,044 kB**.  The seven bare
# ``tempfile.mkdtemp()`` calls in this suite remove nothing they make, which is where
# 31 directories holding 818 MB of that tmpfs came from.
#
# **WHAT THE CEILING IS INSTEAD: ONE INDIVISIBLE WORK UNIT.**  Three full runs on this
# tree, same bundle, same pins, and the SAME THREE FAILURES BY NAME in all three:
#
#     -n 10  --dist=load       4,084 s (68:03)   3 failed, 2,158 passed
#     -n 24  --dist=load       3,425 s (57:05)   3 failed, 2,158 passed   28,172 s of
#                                                                         worker time
#     -n 10  --dist=loadgroup  3,322 s (55:22)   3 failed, 2,159 passed   17,061 s
#
# Fourteen extra workers buy 16%, and the per-worker totals say why: at ``-n 24`` the
# slowest worker was 3,415.0 s against a 3,425 s run, so **the wall clock is the slowest
# WORKER and nothing else**.  28,172 s of test time would finish in 1,174 s at perfect
# balance across 24 and cannot, because ten items are 52% of it and the largest is
# 3,152 s.  The fourteen also cost throughput rather than buying it: the same suite is
# 28,172 s of worker time at ``-n 24`` and 17,061 s at ``-n 10``, and only 5,700 s of
# that gap is the duplicated pass the next paragraph removes.
#
# So ``--maxprocesses`` STAYS AT TEN, for the measured reason and not the old one: ten
# workers finish everything divisible in 2,111 s and the extra fourteen buy 16%.  Override
# upward with ``-n 24`` for that 16% on a machine that is idle IN MEMORY, which on this box
# means ~100 GB free and not merely cores free; a single test still runs alone under
# ``-n 0``.
#
# **THE FOURTEEN FREE CORES ARE NOT AN INVITATION TO A SECOND CONCURRENT FULL SUITE**, and
# the sentence that stood here said they were -- "leaving them free is what lets a second
# lane's suite run beside this one, the normal case during an epic".  That followed from
# the 10.35 GB the paragraph above corrects, and at 93.7 GB a run it is false: two full
# suites at once is ~187 GB of a 125 GB box.  Two attempts at the wall clock below died of
# worker OOM for exactly that reason, and ``pytest-xdist``'s ``--max-worker-restart``
# default of ``4 * numprocesses`` is what hides it -- a killed worker is RESTARTED, so the
# run keeps going with its queue re-dispatched and reports a wall clock nothing can be read
# off.  Before starting a full run, check for one already in flight (``ps -eo
# pid,etime,args | grep '[p]ytest tests/'``) and wait for it; a bound with its cause beats
# two runs that kill each other.  ``./check`` is the loop and costs 1.4 s.
#
# ``--dist=loadgroup`` is what moved the figure, and it is ``load`` plus one rule: tests
# sharing an ``xdist_group`` mark go to one worker.  ``tests/test_emit.py``'s
# ``graded_reports`` is a ``functools.cache``d pass over every graded pair, read by four
# tests -- and ``functools.cache`` DOES NOT CROSS A PROCESS, so under ``load`` three of
# the four landed on gw11, gw22 and gw8 and each paid the whole pass (3,152.4 s,
# 3,027.9 s, 2,675.4 s: 31% of the run, for work that is one pass), while the fourth
# landed on gw22 beside one of them and cost 0.0 s -- which is the proof.  Grouped, the
# four are one unit of 3,314.5 s on one worker and the other nine workers finish in
# 1,331-2,111 s.  ``tests/test_every_check_names_its_set.py`` gates the mark, so a fifth
# reader cannot quietly add a fourth pass.
#
# **THE NEXT BOUND IS THAT UNIT, AND IT IS NOT A SCHEDULING PROBLEM.**  At ``-n 10
# --dist=loadgroup`` the grouped unit is 3,314.5 s against a 3,322 s run and everything
# else is done at 2,111 s, so no ``-n`` and no scheduler touches it: what the unit does is
# grade 1,628 pairs serially in one process, and ONE of them --
# ``media-buy/get-media-buy-delivery-response.json#``, a 2,701,506-byte resolved schema --
# is 1,846.8 s of it at ``-n 10`` and 1,916.7 s at ``-n 24``.  Of that pair's own cost,
# ``check_accepts`` is all but 0.3 s.  Shortening it is a change to ``codegen/harness.py``
# and to nothing in this file.
addopts = "-n auto --maxprocesses=10 --dist=loadgroup"

# --------------------------------------------------------------------------- #
# the type checker, which section 14 step 6 makes the TEST for the decision layer
# --------------------------------------------------------------------------- #
# ``docs/plan/architecture.md`` section 14 step 6: "``Refusal`` stops subclassing
# ``Exception``; every handler returns ``Lowering | Refusal`` ... The type checker is the
# test."  Section 2 says what it tests: "The type checker therefore refuses a caller
# that reads a ``Lowering`` field off a result without handling the ``Refusal`` branch,
# which is the mechanical form of the semantics document's section 9 rule that a crash
# is not an outcome."  So the gate is a checker running CLEAN over the decision layer,
# and this section is what makes "clean" reproducible -- the files it ranges over and
# the two things it is allowed not to know.
#
# ``files`` is the DECISION LAYER and the two ends section 2 puts the effects at, and it
# is listed rather than left to default to ``codegen/`` for one reason: ``harness.py``
# is the VERIFIER, which section 9 keeps separate from the walk, and it carries 29
# pre-existing errors against ``hypothesis.settings`` and ``jsonschema``'s untyped
# surface that are not this layer's and would make the gate unreadable.  A row that
# brings the verifier under the checker adds it here; the list may GROW and may not
# shrink.
#
# ``mypy`` is not a dependency of this project and is not pinned: a checker is an
# instrument and the artifact does not depend on it, so ``tests/test_type_checker.py``
# skips where it is absent and GRADES where it is present.  Run it directly with
#
#     PYTHONPATH=.:src uv run --no-sync python -m mypy
#
# which reads this section and needs no arguments.
[tool.mypy]
files = [
    "codegen/refusal.py",
    "codegen/keywords.py",
    "codegen/ir.py",
    "codegen/bundle.py",
    "codegen/patch.py",
    "codegen/schema",
    "codegen/lower",
    "codegen/compiler.py",
    "codegen/emit.py",
    "codegen/store.py",
    "codegen/constraints.py",
    "codegen/render.py",
    "codegen/dump_exemptions.py",
    "codegen/__main__.py",
]

# The two things the checker is allowed not to know, both of them a MISSING TYPE
# SURFACE and neither a silenced error of ours.  Per module and never blanket, so a
# genuine unresolved import inside ``codegen`` is still an error: an inline
# ``type: ignore`` is what step 6 forbids, and a scoped statement about a third party's
# stubs is not one.
#
# * ``adcp.*`` is this project's own runtime package and ships no ``py.typed``.  Adding
#   one is a change to the WHEEL's public surface -- it promises every annotation in
#   ``src/adcp`` to every consumer's checker -- so it is a decision for the row that
#   owns the shipped package and not a side effect of this one.
# * ``jsonschema`` ships no stubs (``types-jsonschema`` is a separate distribution).
[[tool.mypy.overrides]]
module = ["adcp.*", "jsonschema.*"]
ignore_missing_imports = true
follow_untyped_imports = false
