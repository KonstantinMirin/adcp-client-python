[project]
name = "adcp-emit"
version = "0.0.0"
description = "Emit the AdCP SDK types from the schema bundle."
# The FLOOR is 3.11 because D2 makes an `enum` node a `StrEnum`, which is 3.11.
# The alternative, `class X(str, Enum)`, gives a member whose `str()` is
# "MatchType.BROAD" rather than "broad", which is not what a wire type means by
# being a string -- so the floor moves rather than the decision. Reversible in
# this one line if D2 is re-decided.
#
# Capped because the two pins have to hold together: `datamodel-code-generator`
# requires `pydantic>=2.14` on 3.15 and up, and the pydantic pin below is exact
# to a minor because the rendered annotation and the error shape are both a
# function of it. 3.15 is unreleased; the cap is lifted by moving the pydantic
# pin, not by floating the compiler.
requires-python = ">=3.11,<3.15"
dependencies = [
    # The harness grades a (JSON Schema document, Python class) pair. These four
    # are everything it imports, and the emitter adds nothing to them.
    "pydantic>=2.13.0,<2.14",
    "jsonschema>=4.20.0",
    # `jsonschema` asserts NOTHING for a draft-07 `format` unless its checker for
    # that format is installed, and D5 lets a format select a Python type only
    # where the schema half asserts it.  These two are what make the bundle's
    # formats checkable: `rfc3339-validator` registers `date-time` (and `time`)
    # and `rfc3987` registers `uri` (and `uri-reference`, `iri`,
    # `iri-reference`); `date`, `email`, `idn-email`, `ipv4`, `ipv6` and `regex`
    # come with `jsonschema` itself.  Runtime dependencies and not dev ones,
    # because `strict_validate` is what decides acceptance (D4): without them a
    # deployed SDK accepts a `date-time` with no offset and an `AwareDatetime`
    # field would then be narrower than the document it names.  Measured on the
    # 1,054 portable documents of the 3.2 bundle, they move `date-time` (437
    # uses) and `uri` (300) from ungraded to graded, which is 737 of 806.
    "rfc3339-validator>=0.1.4",
    "rfc3987>=1.3.8",
    # D10: the compiler. `f(schemas, pinned compiler)` has two arguments and this
    # is the second, so it is pinned exactly rather than floated -- the rendered
    # text is a function of the version, and the byte compare in `test_emit` is
    # stated over one. Driven through its pydantic-v2 MODEL layer only; its
    # parser never runs (`codegen/compiler.py`).
    "datamodel-code-generator==0.86.0",
    # Pinned exactly. A hypothesis example stream is a function of the version:
    # the same control pair measured 30/40 at 6.98.0, 24 at 6.112.0, 25 at
    # 6.125.0, 28 at 6.140.0 and 6.168.5, 20 at 6.170.5. 6.169.0 raises the
    # floor to Python 3.11, above requires-python here.
    "hypothesis==6.168.5",
    "hypothesis-jsonschema==0.23.1",
]

[project.optional-dependencies]
# ``pytest-xdist`` is pinned like the other test-time pins above, because it
# decides how many processes grade the set of pairs and a floating major could
# change that silently.
#
# ``ruff`` is NOT pinned here, for the reason ``[tool.mypy]`` states about the
# type checker: a checker is an instrument and the artifact does not depend on
# it.  Its rule set is pinned instead, by ``[tool.ruff] required-version``,
# which is the thing an upgrade could move.
dev = ["pytest>=7.0.0", "pytest-xdist==3.8.0", "ruff>=0.17"]

[build-system]
# The emitted tree is a package, not a directory of files: the step-1 outcome is
# that `from adcp.types._schemas.core.pagination_request import PaginationRequest`
# works, and an uninstalled project makes that conditional on PYTHONPATH.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The schema documents are not documentation of the build: `strict_validate`
# reads the one its own class names (`__adcp_schema__`) to decide acceptance
# (D4). A wheel without them imports and then raises on the first validation,
# which is the one failure mode a test run from the source tree cannot see. One
# file per document, named by the document's own bundle-relative path, so the
# read is of that document and never of a table.
#
# ``py.typed`` is PEP 561's marker and it is listed BESIDE the documents rather
# than left to a default, for the same reason: a marker that packaging drops
# makes the promise and does not keep it.  Without the file in the wheel a
# consumer's checker reports `Skipping analyzing "adcp.types.core": module is
# installed, but missing library stubs or py.typed marker` and then `Revealed
# type is "Any"`, so every annotation this compiler derives -- 14,570 fields,
# 991 ``Literal``s, 244 ``StrEnum``s, 582 union arms -- is invisible at the one
# boundary it was built for.  ``final-state.md`` reading 7 is the decision, and
# ``tests/test_type_checker.py::test_the_package_declares_its_types_to_a_consumer``
# reads this declaration back so the marker cannot be shipped by accident or
# dropped by one.
[tool.setuptools.package-data]
"adcp" = ["py.typed"]
"adcp.types._schemas" = ["*.json", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# **WHICH TREE IS GRADED, and it is declared here because an environment variable per
# lane is not a mechanism.**  Every check in this suite grades a pair -- a class the
# EMITTER produced, under ``adcp``, against the document it names, read through
# ``codegen`` -- and the import system resolves those two halves independently.  A
# sibling worktree's ``.venv`` is a SYMLINK to the main checkout's, because these pins are
# exact and a second environment per lane is not free, and that environment carries an
# editable install:
#
#     .venv/lib/python3.12/site-packages/__editable__.adcp_emit-0.0.0.pth
#         /srv/ws/adcp-client-python/src
#
# ``site`` reads that at interpreter start, so with ``PYTHONPATH`` unset ``adcp`` resolves
# to the MAIN checkout from any worktree while ``codegen`` -- which is not under ``src``
# and so not in the ``.pth`` -- resolves from the current directory.  **The run then
# grades one tree's emitted classes with another tree's compiler and reports a verdict
# about neither**, in a suite that is green or red for ordinary-looking reasons either way.
# ``adcp-client-python-82m.43`` is the row; a lane found it on itself after four batches
# and re-ran them.
#
# ``pythonpath`` is applied in ``pytest_load_initial_conftests`` -- before conftest import
# and before collection, which is the window that matters because ``tests/conftest.py``
# imports ``codegen`` at module scope -- and the entries are inserted at the FRONT of
# ``sys.path``, ahead of the ``.pth``.  Relative to ROOTDIR, so a run in any worktree
# resolves both halves from THAT worktree whatever the environment holds.  ``.`` is
# ``codegen`` and ``src`` is ``adcp``: the same two roots ``./check``'s preamble sets, and
# the preamble stays correct for the non-pytest entry points it covers.
#
# **THE PREVENTION IS NOT THE DETECTION**, and ``docs/plan/final-state.md`` asks a reading
# to name something that fails when it fails.  ``tests/test_one_tree_is_graded.py`` reads
# the two halves back off ``__file__`` in the process that does the grading, and proves
# its own red by constructing a mixture out of two temporary checkouts rather than by
# arguing one is impossible.  This declaration without that check is one ``.pth``, one
# ``--import-mode`` or one plugin away from being silently false again.
pythonpath = [".", "src"]

# EVERY RUN IS PARALLEL, because the expensive part of this suite is one
# ``check_pair`` per emitted pair and those are independent of each other.
# Measured on the same tree, same pins, same bundle: 1,070 s serial against
# 366 s at ten workers, 2.9x, with the SAME verdict -- three failures, the same
# three by name. A faster suite that grades something else would not be faster,
# so the identity of the failure set is the thing to check if this ever changes.
#
# **THAT PAIR IS KEPT AS A RATIO AND IS STALE AS AN ABSOLUTE.**  The emitted set has
# grown eleven-fold in wall clock since it was taken while the passing count grew 4%
# (``adcp-client-python-10l.31``'s note carries the curve), and the figures below are the
# current ones. No serial figure is restated beside them because none was taken: a serial
# run of this suite is the 17,061 s of worker time the last row of the table reports.
#
# **MEMORY IS THIS SUITE'S OTHER CEILING, AND THE FIGURE THAT SAID OTHERWISE WAS A
# READING OF A SMALLER TREE.**  What stood here was "memory is not this suite's ceiling
# and the OOM figure does not reproduce", over a ``-n 24`` measurement taken at
# ``adcp-client-python-10l.31``: 10.35 GB resident across all 25 processes at once,
# 1,211 MB in the worst worker, 331 MB median, against 88 GB available.  **Re-measured at
# ``-n 10`` on 2026-10-30 (``adcp-client-python-3be.18``), over the tree whose wall clock
# the table below reports: 93.7 GB resident across 11 processes at once, 14,521 MB in the
# worst worker, 11,393 MB median** -- 1,253 samples at 5 s, sampler attached BEFORE pytest.
# Summed, 9.1x the figure it replaces; in the MEDIAN worker, 34x.
# The old reading was not wrong when it was taken and it is not a reading of this suite:
# it predates the emitted set the paragraph above already calls an eleven-fold growth in
# wall clock, and what grew is the thing that holds the memory -- ``check_accepts`` over a
# RESOLVED schema, which for ``media-buy/get-media-buy-delivery-response.json#`` is
# 2,701,506 bytes and 1,846.8 s of one worker.  So a cap set to protect memory now
# protects something, which is the opposite of what this paragraph used to conclude.
#
# **ATTACH THE SAMPLER BEFORE PYTEST, because a late sample is a FLOOR and reads like a
# peak.**  A second run of the same suite was sampled only from 3 h 15 m in, and its
# largest per-sample sum ROSE monotonically for as long as it was watched -- 70.4 GB after
# 18 minutes of sampling, 77.9 GB after 25, 86.3 GB after 33, all of them "the peak" at the
# moment they were read and all of them under the 93.7 GB a run watched from the start
# reports.  The three numbers of that curve are kept here as the shape of the mistake, not
# as readings of anything.  If a figure has to be cited off a late sample, cite it as
# "at least".
#
# **AND THE RUN WATCHED FROM THE START DID NOT SURVIVE EITHER.**  MemAvailable reached
# **1.0 GB of 125** and the kernel took two workers -- ``gw4`` at 1 h 37 m and ``gw0`` at
# 2 h 05 m, ``oom_kill`` 50 -> 52, each one a ``node down: Not properly terminated`` in the
# log and each one restarted by xdist with its queue re-dispatched.
# Moving the scratch to disk removes the tmpfs term below and does NOT remove this one:
# the dominant term is worker RSS, the median worker is 11.4 GB, and ten of those plus a
# master do not fit beside anything else on this box.  So the honest statement of the
# ceiling is that the suite at ``-n 10`` needs the machine to itself, and the next measured
# step is whether a lower ``--maxprocesses`` trades wall clock for a run that completes --
# not a figure this file can assert without taking it.
#
# **HOW TO RE-DERIVE IT -- and state the reading WITH this derivation, never the figure
# alone**, which is what let the paragraph above go an order of magnitude stale while
# every lane read it:
#
#     out=/srv/ws/.adcp-measure/$(date +%s)        # a DISK path; see SCRATCH below
#     mkdir -p "$out"
#     PYTHONPATH=.:src ./.venv/bin/python -m pytest tests/ -p no:randomly -v -rf \
#         --durations=25 --junitxml="$out/run.xml" > "$out/run.log" 2>&1 &
#     ./rss_sampler.sh "$out/rss.txt" "$!" &                 # the MASTER's pid
#     ./.venv/bin/python suite_report.py "$out/run.log" "$out/run.xml" "$out/rss.txt"
#
# ``rss_sampler.sh`` takes the figure and ``suite_report.py`` reduces it to the two the
# ceiling question needs: ``PEAK RSS per process`` decides whether ONE worker can be
# killed on its own, and ``PEAK CONCURRENT TOTAL`` -- the per-SAMPLE sum, not the sum of
# the per-process peaks -- is the only one the kernel acts on.  The sampler is given the
# master's pid and walks its descendants, because the form that summed every ``.venv``
# process on the box could not be read during an epic, which is when it is read.
# ``/proc/vmstat``'s ``oom_kill`` counter, read before and after, is what says whether a
# run survived -- and it is the only thing that does, because ``pytest-xdist`` RESTARTS a
# killed worker (see ``--max-worker-restart`` below) and the summary line says nothing
# about it.  Both runs of 2026-10-30 are readable only through that counter: the
# late-sampled one went **49 -> 50 at the moment it exited**, after 3 h 53 m, with six of
# its ten workers already in state ``Z`` and six replacements spawned from 1 h 10 m onward;
# the sampled-from-the-start one went **50 -> 52**, at 1 h 37 m and again at 2 h 05 m, and
# kept running on replacements.  Neither run reports any of it.  That is the third and
# fourth attempt at the wall clock below to meet the kernel rather than anything in the
# code, and a lane that reads only the summary line will record the fourth as a success.
#
# **AND THE SCRATCH IS A SECOND CLAIM ON THE SAME RAM, which no RSS figure shows.**
# ``/tmp`` on this box is a 63 GB TMPFS, so a byte written there is a byte of RAM that is
# in NO process's RSS -- the two readings add, and a ceiling computed from either alone is
# wrong by the other.  Measured during the late-sampled run: 86.3 GB of resident workers
# beside 23 GB in ``/tmp``, against 125 GB total, with MemAvailable at 13.4 GB and SwapFree
# at **4 kB** of 3 GB.  10.2 GB of that tmpfs was orphaned scratch from torn-down lanes with
# ZERO open handles -- checked, then removed, which returned MemAvailable to 16.5 GB and
# SwapFree to 87 MB without touching the run.  **That 10.2 GB was larger than the headroom
# the run had left**: MemAvailable still reached 6.1 GB afterwards, so without the reclaim
# the same run would have met the kernel again, which is the sense in which orphaned
# scratch on a tmpfs is not free.  ``tests/conftest.py``'s ``SCRATCH`` keeps
# the suite's own share of that off a memory-backed filesystem and
# ``tests/test_scratch_is_on_disk.py`` reads it back off ``/proc/mounts``;
# ``docs/plan/architecture.md`` ("The suite's scratch goes on DISK, not in RAM",
# 2026-10-30) is the decision.  Read back AFTER it, and the cleanest reading was an
# accident of timing: during the sampled run above, ANOTHER lane's suite without this fix
# put **835,248 kB** into ``/tmp`` while this one put **836,064 kB** of the same package on
# ``/dev/md2``, and this run's own share of ``/tmp`` never exceeded **228 kB**.  Before the
# fix a run's basetemp in ``/tmp`` was **828,044 kB**.  The seven bare
# ``tempfile.mkdtemp()`` calls in this suite remove nothing they make, which is where
# 31 directories holding 818 MB of that tmpfs came from.
#
# **WHAT THE CEILING IS INSTEAD: ONE INDIVISIBLE WORK UNIT.**  Three full runs on this
# tree, same bundle, same pins, and the SAME THREE FAILURES BY NAME in all three:
#
#     -n 10  --dist=load       4,084 s (68:03)   3 failed, 2,158 passed
#     -n 24  --dist=load       3,425 s (57:05)   3 failed, 2,158 passed   28,172 s of
#                                                                         worker time
#     -n 10  --dist=loadgroup  3,322 s (55:22)   3 failed, 2,159 passed   17,061 s
#
# Fourteen extra workers buy 16%, and the per-worker totals say why: at ``-n 24`` the
# slowest worker was 3,415.0 s against a 3,425 s run, so **the wall clock is the slowest
# WORKER and nothing else**.  28,172 s of test time would finish in 1,174 s at perfect
# balance across 24 and cannot, because ten items are 52% of it and the largest is
# 3,152 s.  The fourteen also cost throughput rather than buying it: the same suite is
# 28,172 s of worker time at ``-n 24`` and 17,061 s at ``-n 10``, and only 5,700 s of
# that gap is the duplicated pass the next paragraph removes.
#
# So ``--maxprocesses`` STAYS AT TEN, for the measured reason and not the old one: ten
# workers finish everything divisible in 2,111 s and the extra fourteen buy 16%.  Override
# upward with ``-n 24`` for that 16% on a machine that is idle IN MEMORY, which on this box
# means ~100 GB free and not merely cores free; a single test still runs alone under
# ``-n 0``.
#
# **THE FOURTEEN FREE CORES ARE NOT AN INVITATION TO A SECOND CONCURRENT FULL SUITE**, and
# the sentence that stood here said they were -- "leaving them free is what lets a second
# lane's suite run beside this one, the normal case during an epic".  That followed from
# the 10.35 GB the paragraph above corrects, and at 93.7 GB a run it is false: two full
# suites at once is ~187 GB of a 125 GB box.  Two attempts at the wall clock below died of
# worker OOM for exactly that reason, and ``pytest-xdist``'s ``--max-worker-restart``
# default of ``4 * numprocesses`` is what hides it -- a killed worker is RESTARTED, so the
# run keeps going with its queue re-dispatched and reports a wall clock nothing can be read
# off.  Before starting a full run, check for one already in flight (``ps -eo
# pid,etime,args | grep '[p]ytest tests/'``) and wait for it; a bound with its cause beats
# two runs that kill each other.  ``./check`` is the loop and costs 1.4 s.
#
# ``--dist=loadgroup`` is what moved the figure, and it is ``load`` plus one rule: tests
# sharing an ``xdist_group`` mark go to one worker.  ``tests/test_emit.py``'s
# ``graded_reports`` is a ``functools.cache``d pass over every graded pair, read by four
# tests -- and ``functools.cache`` DOES NOT CROSS A PROCESS, so under ``load`` three of
# the four landed on gw11, gw22 and gw8 and each paid the whole pass (3,152.4 s,
# 3,027.9 s, 2,675.4 s: 31% of the run, for work that is one pass), while the fourth
# landed on gw22 beside one of them and cost 0.0 s -- which is the proof.  Grouped, the
# four are one unit of 3,314.5 s on one worker and the other nine workers finish in
# 1,331-2,111 s.  ``tests/test_every_check_names_its_set.py`` gates the mark, so a fifth
# reader cannot quietly add a fourth pass.
#
# **THE NEXT BOUND IS THAT UNIT, AND IT IS NOT A SCHEDULING PROBLEM.**  At ``-n 10
# --dist=loadgroup`` the grouped unit is 3,314.5 s against a 3,322 s run and everything
# else is done at 2,111 s, so no ``-n`` and no scheduler touches it: what the unit does is
# grade 1,628 pairs serially in one process, and ONE of them --
# ``media-buy/get-media-buy-delivery-response.json#``, a 2,701,506-byte resolved schema --
# is 1,846.8 s of it at ``-n 10`` and 1,916.7 s at ``-n 24``.  Of that pair's own cost,
# ``check_accepts`` is all but 0.3 s.  Shortening it is a change to ``codegen/harness.py``
# and to nothing in this file.
addopts = "-n auto --maxprocesses=10 --dist=loadgroup"

# --------------------------------------------------------------------------- #
# the type checker, which section 14 step 6 makes the TEST for the decision layer
# --------------------------------------------------------------------------- #
# ``docs/plan/architecture.md`` section 14 step 6: "``Refusal`` stops subclassing
# ``Exception``; every handler returns ``Lowering | Refusal`` ... The type checker is the
# test."  Section 2 says what it tests: "The type checker therefore refuses a caller
# that reads a ``Lowering`` field off a result without handling the ``Refusal`` branch,
# which is the mechanical form of the semantics document's section 9 rule that a crash
# is not an outcome."  So the gate is a checker running CLEAN over the decision layer,
# and this section is what makes "clean" reproducible -- the files it ranges over and
# the one thing it is allowed not to know.
#
# ``files`` is the DECISION LAYER, the two ends section 2 puts the effects at, AND THE
# SHIPPED PACKAGE, and it is listed rather than left to default to ``codegen/`` for one
# reason: ``harness.py`` is the VERIFIER, which section 9 keeps separate from the walk,
# and it carries 29 pre-existing errors against ``hypothesis.settings`` and
# ``jsonschema``'s untyped surface that are not this layer's and would make the gate
# unreadable.  A row that brings the verifier under the checker adds it here; the list
# may GROW and may not shrink.
#
# **``src/adcp`` IS IN THE LIST, because it is the artifact every reading is about.**  It
# was absent, and what that cost was measured rather than argued: with the package out of
# scope the only error in the shipped hand-written code was
# ``src/adcp/types/_base.py:1190: Name "cls._branch_models" is not defined``, sitting
# inside ``_branch_adapter`` -- the same function behind the union-root dispatch defect --
# and nothing was reading it.  Two more appeared the moment ``adcp.*`` resolved to real
# types instead of ``Any``: ``codegen/render.py``'s ``_rule`` was annotated with one of
# ``Rule``/``ValueRule`` and is called with both.  All three are fixed; none was fixed by
# a suppression.
#
# **``exclude`` names the EMITTED TREE, and it is not this gate's subject by a decision
# already recorded.**  ``docs/plan/architecture.md``, "The subject of grading is a FRESH
# EMIT, never the committed tree": "The committed tree is an ARTIFACT, verified by one
# byte-compare, and is never the subject."  ``src/adcp/types/_schemas`` is 2,138 generated
# modules whose annotations are a function of the bundle and of the pinned compiler, so a
# type error there is a RENDERING defect and is fixed in ``codegen/render.py``, never in
# the file that reports it -- which is also why this is an exclusion and not an
# ``ignore_errors``: nothing here says the errors are acceptable, and they are counted and
# attributed instead.  Measured with the invocation below on 2026-11-03: **175 errors in
# 59 of those modules -- 159 ``[assignment]``, 12 ``[misc]``, 4 ``[valid-type]``** --
# against the 440 (362 ``[assignment]``, 78 ``[list-item]``) ``docs/plan/rebuild-plan.md``
# records for the same tree, so the set is shrinking under the row that owns it
# (rebuild-plan's "TWO RENDERINGS THAT DO NOT TYPE-CHECK, and both are cells").  That row
# removes this exclusion.  Until then, re-derive the figure with
#
#     PYTHONPATH=.:src python -m mypy --no-incremental --config-file=/dev/null \
#         src/adcp/types/_schemas
#
# -- ``--config-file`` and not ``--exclude``, because a CLI ``--exclude`` ADDS to the one
# below rather than replacing it, and the directory then reports "no .py[i] files".
#
# **And note that ``exclude`` does not hide them by import either**: mypy applies it to
# files it CRAWLS, not to modules an explicit source imports, so every one of the 2,138 is
# still read for the types the domain modules re-export -- which is what makes the
# consumer-facing promise ``py.typed`` carries a real one.
#
# ``mypy`` is not a dependency of this project and is not pinned: a checker is an
# instrument and the artifact does not depend on it.  **But a gate that disappears with
# its own instrument reports green**, which ``docs/plan/final-state.md`` forbids in those
# words, so ``tests/test_type_checker.py`` ERRORS where the checker is absent rather than
# skipping.  Run it directly with
#
#     PYTHONPATH=.:src python -m mypy --no-incremental
#
# which reads this section and needs no arguments.  **``PYTHONPATH=.:src`` is not
# optional**: mypy's search path is built from ``sys.path``, so without it ``adcp.*``
# resolves to nothing, the override below cannot apply to a package that is in ``files``,
# and the run reports ~43 errors in ``codegen/harness.py`` that are an artifact of the
# invocation and not defects.  One wrong P1 was filed off exactly that.
[tool.mypy]
files = [
    "codegen/refusal.py",
    "codegen/keywords.py",
    "codegen/ir.py",
    "codegen/bundle.py",
    "codegen/catalogue.py",
    "codegen/patch.py",
    "codegen/schema",
    "codegen/lower",
    "codegen/compiler.py",
    "codegen/intersect.py",
    "codegen/emit.py",
    "codegen/store.py",
    "codegen/constraints.py",
    "codegen/render.py",
    "codegen/dump_exemptions.py",
    "codegen/__main__.py",
    "src/adcp",
]
exclude = "^src/adcp/types/_schemas/"

# The one thing the checker is allowed not to know, and it is a MISSING TYPE SURFACE
# rather than a silenced error of ours.  Per module and never blanket, so a genuine
# unresolved import inside ``codegen`` is still an error: an inline ``type: ignore`` is
# what step 6 forbids, and a scoped statement about a third party's stubs is not one.
#
# ``jsonschema`` ships no stubs (``types-jsonschema`` is a separate distribution).
#
# **``adcp.*`` WAS here and is gone.**  It read "this project's own runtime package and
# ships no ``py.typed``.  Adding one is a change to the WHEEL's public surface ... a
# decision for the row that owns the shipped package" -- this is that row, the marker is
# at ``src/adcp/py.typed`` and declared in ``[tool.setuptools.package-data]`` above, and
# an override that resolved our own package to ``Any`` would now hide the package from the
# gate that just took it in.
[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
follow_untyped_imports = false


# =============================================================================
# The linter, added 2026-11-03 under ``docs/plan/final-state.md``'s decision
# "AN INVARIANT OVER THE CODE IS NOT A STRUCTURAL ASSERTION": *"the ordinary
# tools count as invariants here.  A linter's unused-import, shadowed-name,
# mutable-default and dead-code rules are invariants over behaviour, not shape
# pins -- so their absence is not neutrality, it is an unmeasured surface."*
#
# **THIS SECTION IS A READING AND NOT YET A GATE.**  Nothing invokes ``ruff``:
# ``./check`` does not call it and no test imports it.  The reading at the
# commit that added this is **286 findings** over ``codegen/``, ``tests/`` and
# ``src/adcp`` minus the generated tree.  The wiring -- a test on
# ``tests/test_type_checker.py``'s pattern, which ERRORS rather than skips when
# the instrument is absent -- lands when that number is zero and never beside a
# baseline, because ``final-state.md`` forbids a ratchet set below the truth.
#
#     .venv/bin/ruff check codegen tests src/adcp
#
# needs no arguments: unlike mypy above, ruff reads no ``sys.path`` and the
# ``PYTHONPATH`` caveat does not apply.  **A linter needs no stubs, which is the
# single reason this was worth adding**: ``codegen/harness.py`` is the one file
# ``[tool.mypy] files`` deliberately omits, and the first thing reported there
# is an ``F821`` undefined ``Collection`` in ``check_refuses`` -- live, and
# reproducible as ``NameError`` through ``typing.get_type_hints``.
[tool.ruff]
# Pinned, against ruff's own moving target: 0.16.0 took the default rule set
# from 59 rules to 413.  A reading that changes on an upgrade is the thing
# ``final-state.md`` forbids, so the floor is stated here and ``select`` below
# is explicit rather than an extension of whatever the default happens to be.
required-version = ">=0.17"
line-length = 120
target-version = "py311"

# **NOTHING IS EXCLUDED. THE GENERATED CODE IS THE PRODUCT (owner's decision).**
#
# An earlier form of this section excluded the emitted tree, on the argument
# that a finding there is a statement about ``codegen/render.py`` and that a fix
# in the file is undone by the next run.  **The first half is true and the
# conclusion is backwards.**  A finding whose fix belongs to the generator has
# an OWNER -- the generator -- and an owner is the opposite of an exemption.
# Excluding it means the renderer can emit unsorted imports, imports nothing
# uses and a mutable class default forever with nothing saying so, in **the code
# a consumer installs**: the wheel is 1,089 generated modules plus the 25
# ``emit.write`` puts beside them, and three hand-written files.
#
# So the linter grades the whole package, and a finding in a generated module is
# a row against ``codegen/render.py``.  Fixing the renderer fixes 1,089 modules
# at once, which is the argument FOR having the reading rather than against it.
#
# The reading as this landed, over the generated tree alone and with ``E501``
# already dropped below: **399 ``I001``, 31 ``RUF022``, 14 ``F401``, 6
# ``RUF012``, 1 ``UP033``, 1 ``RUF100``.**  Every one is a decision
# ``render.py`` makes about its output, and ``RUF012`` -- a mutable default on a
# model -- is a behaviour risk and not a style question.
#
# ``[tool.mypy]``'s ``exclude`` of ``_schemas`` stays as it is for its own
# recorded reason, which is about READABILITY of a gate carrying third-party
# stub noise rather than about whose code it is, and its ``files`` list already
# takes the 25 beside the tree.

[tool.ruff.lint]
# ``select`` and never ``extend-select``, for the ``required-version`` reason.
# ``F`` is the whole point -- F401/F811/F821/F841/F402 are the four rules the
# decision names.  ``B`` carries B006 mutable-default.  ``I`` replaces the
# ``isort`` in the venv that nothing has ever invoked.  ``RUF100`` is what
# reports a suppression that suppresses nothing, and this tree has 103 of them.
#
# DELIBERATELY NOT SELECTED, each for a measured reason:
#   C90  mccabe -- a complexity ceiling is a COUNT in ``final-state.md``'s
#        sense: it says *there are N branches here*, freezes the structure, and
#        answers the incidental-complexity question with a threshold.
#   ERA  commented-out code -- this codebase's docstrings quote JSON and
#        pointers as prose; it would fire on the prose.
#   D    pydocstyle -- the docstring convention here is deliberate and unlike
#        any pydocstyle profile; ``tests/test_prose_resolves.py`` enforces the
#        checkable part and enforces it better.
#   ANN  redundant under a configured mypy.  COM redundant under a formatter.
#   S    bandit -- no untrusted input, and it would fire on ``assert``
#        throughout ``tests/``.
#   BLE, SLF, ARG, TRY -- measured at ~165 further findings, stylistic, and
#        NOT declined silently: 42 of the ``RUF100`` findings are ``noqa``
#        comments naming ``BLE001`` and ``SLF001``, so the suppressions in this
#        tree were written against families that are not selected.  Every
#        ``noqa`` must name a selected rule or be deleted; that is a row, and
#        selecting a family to retroactively justify a comment is backwards.
#
# **AND THE LIST IS NOW ``ALL``, NOT EIGHT FAMILIES (owner's decision).** The
# eight above were copied from a reference repository that runs no CI, which is
# no basis for a rule set: ruff ships **973 rules** and selecting 8 families
# graded a fraction of them while reading as a configured linter.  The form is
# inverted -- **select everything, then decline by NAME with a measurement** --
# because that way every rule this project does not enforce is written down
# with its reason, and a rule nobody thought about is enforced rather than
# silently absent.
#
# Measured over the hand-written code at the commit that landed this:
# ``--select ALL`` reads ~6,500 findings in 30 families.  The declines below
# account for ~5,900 of them and each says why; what is left is rows.
#
# **Selecting ``BLE`` and ``SLF`` also makes 51 existing ``noqa`` comments
# LIVE.**  The tree carries 28 naming ``BLE001`` and 23 naming ``SLF001``,
# written against a linter that did not exist -- so the code already documented
# those decisions and now a tool reads them.
select = ["ALL"]
allowed-confusables = ["\u00d7", "\u2013", "\u2019", "\u2018"]
ignore = [
    # The prose in this repository is load-bearing and long by design -- the
    # comment block above ``[tool.mypy]`` runs past 100 lines.  This is a
    # formatting preference and not an invariant over behaviour, and no
    # formatter is configured here to own it.  In the generated tree the long
    # lines are schema ``description`` text carried verbatim, which is DATA.
    "E501",
    # ``RUF001``-``RUF003`` ARE NOT DECLINED.  They are PARAMETERISED below, by
    # ``allowed-confusables``, which a lane proposed against an earlier form of
    # this section that ignored them outright -- and the lane was right: naming
    # the three characters that occur keeps every OTHER confusable reporting,
    # where ignoring the rules says nothing is at risk anywhere.  That is the
    # difference between parameterising a rule and turning it off.
    # Mutable class default: every instance of it in this repository is a
    # PYDANTIC FIELD or a ``model_config``, and the semantics document's §5
    # already carries the measurement -- "pydantic deep-copies a plain mutable
    # default per instance, so two instances already receive distinct objects
    # and mutating one does not reach the other".  Six are a generated
    # ``= ['brief']`` or ``= []`` on a model field; the seventh is a
    # ``model_config`` dict.  Ruff cannot tell a model field from a plain class
    # attribute, so the rule reports a hazard this framework removes.  Declined
    # by NAME with the measurement, which is the only way a rule may be
    # declined -- had one instance been a plain class, this would be a row.
    "RUF012",

    # ---- the formatter's domain, and NO FORMATTER IS CONFIGURED -----------
    # ``Q`` (957 bad-quotes-inline-string, 10 avoidable-escaped-quote) and
    # ``COM`` (611 missing-trailing-comma, 8 prohibited) are a formatter's
    # output, not an invariant over behaviour.  Declining them is honest only
    # because the alternative is named: adopting ``ruff format`` is a row, and
    # until it lands nothing enforces quote or comma style.  Do not fix these
    # by hand -- 1,586 findings of churn with no behaviour behind it.
    "Q", "COM",

    # ---- redundant under a checker or a check we already have -------------
    # ``ANN`` (403): mypy is configured strict over this tree; an annotation
    # rule restates what the checker already requires.
    # ``D`` (860): the docstring convention here is deliberate and unlike any
    # pydocstyle profile, and ``tests/test_prose_resolves.py`` enforces the
    # checkable part -- that a docstring naming a path or a symbol RESOLVES --
    # which no pydocstyle rule does.
    # ``CPY`` (95): no license-header policy exists; adopting one is a decision
    # and not a lint finding.
    # ``ERA``: this codebase's docstrings quote JSON and pointers as prose, so
    # it fires on the prose.
    "ANN", "D", "CPY", "ERA",

    # ---- the complexity family, DEFERRED BY A RECORDED DECISION ----------
    # ``architecture.md`` §5: a ceiling on complexity or length is set AFTER
    # the decomposition and the two are set together, because a ceiling set
    # today freezes the debt and is satisfiable by moving statements.  These
    # are the rules that ceiling is made of, and the row that lands the
    # decomposition (``adcp-client-python-g4z``) re-selects them.  Their
    # reading today is the worklist, not a gate: 26 PLR0913, 26 PLR0911,
    # 20 PLR0912, 11 PLR0917, 10 PLR0915.
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR0904", "C901",

    # ---- declined with a measurement, each a statement about THIS tree ----
    # ``TC`` (52): it moves an import into a ``TYPE_CHECKING`` block -- which
    # is the exact construction that produced the ``NameError`` this linter was
    # added for.  Every module here has ``from __future__ import annotations``,
    # so an annotation is already a string and the import costs nothing at
    # runtime; moving it into a conditional block makes ``get_type_hints``
    # fail, and that defect has now appeared FOUR times in one file.  A rule
    # that creates the defect class the tool caught is declined.
    # ``PLC0415`` (120): an import inside a function is deliberate here -- it
    # breaks an import cycle, and ``tests/conftest.py``'s is a SIDE-EFFECT
    # import that binds the generated half of the package.  ``E402`` still
    # owns module-level ordering.
    # ``TRY003`` (57) and ``EM101``/``EM102`` (60): they require an exception
    # message to be a constant.  High churn, no behaviour, and this project's
    # messages carry the measurement that explains the failure.
    # ``PT018`` (65): a composite assertion is how a check states one fact
    # about two halves, and every one here carries its own message.
    # ``PLR2004`` (55): a comparison against a literal is frequently the
    # CONTENT of a check here, not a magic number in logic.
    # ``FBT003`` (141): a boolean at a CALL site.  ``FBT001``/``FBT002`` stay
    # selected, which is where the design fact is -- a boolean PARAMETER.
    "TC", "PLC0415", "TRY003", "EM101", "EM102", "PT018", "PLR2004", "FBT003",

    # ``PLC0414`` useless-import-alias (1,945): **this rule is WRONG for this
    # package and following it would break reading 7.**  ``X as X`` is the
    # PEP 484 explicit re-export form, and it is what tells a consumer's type
    # checker that a name imported into ``adcp.types.<domain>`` is part of that
    # module's public interface.  We ship ``py.typed``, so the promise is load
    # bearing: ``core.py`` alone carries 971 of these, every one a re-export of
    # a class from the private module at the document's own path.  A linter rule
    # that calls the idiom useless is reading it as ordinary code.
    "PLC0414",

    # ``TID252`` relative-imports (2,228): a relative import WITHIN a package
    # is valid Python and is what ``codegen/render.py`` emits for a
    # cross-document reference -- ``from ..enums.action_source import
    # ActionSource``.  The rule exists for projects whose policy bans them;
    # this project has no such policy, and adopting one would be a decision
    # about the renderer's output rather than a defect in it.
    "TID252",
]

# A per-file ignore says "this rule does not apply to this KIND of file", which
# is different from an exclusion ("these files are not the subject") and
# different from a blanket ignore ("this rule applies nowhere").  Three, each
# measured:
[tool.ruff.lint.per-file-ignores]
# ``assert`` IS the test -- 2,325 of them, and S101 is the only reason bandit
# reads this directory as unsafe.  The rest of ``S`` stays live in tests, which
# is where the subprocess rules (S603, S607) actually fire.
# ``SLF001`` (65): a test that grades an internal must name it, and 23 ``noqa``
# comments already said so one site at a time.
# ``INP001`` (55): ``tests/`` is deliberately not a package -- ``pythonpath``
# in ``[tool.pytest.ini_options]`` is what puts it on the path.
"tests/*" = ["S101", "SLF001", "INP001"]
# ``T201`` print: ``codegen/__main__.py`` is a command-line program and print
# is its output channel.  Everywhere else a print is a finding.
"codegen/__main__.py" = ["T201"]
# The emitted tree's ``__init__.py`` files are 0 bytes by design (the layout
# rule beside ``emit.write``), so a docstring rule has nothing to attach to.
"src/adcp/types/_schemas/**/__init__.py" = ["D104"]

# **THE THREE CONFUSABLES THAT OCCUR, each typed on purpose.**  The rules stay
# SELECTED, so a character typed by ACCIDENT where its ASCII twin was meant --
# which is what they exist to catch -- still reports.
#
#   ``×``  is this repository's own multiplication sign.  "keyword × position"
#          is the name of the central declaration in both deciding documents,
#          and two code comments cite it by that name; spelling those ``x``
#          would make the code disagree with the documents it quotes.
#   ``–``  the en dash, and almost every instance is in a GENERATED docstring,
#          carried verbatim from a schema ``description``.  Rewriting it would
#          make the emitted docstring differ from the document it quotes, which
#          is a rendering defect and not a fix.
#   ``’``  the curly apostrophe, same provenance, four instances.
[tool.ruff.lint.isort]
known-first-party = ["adcp", "codegen"]
