[project]
name = "adcp-emit"
version = "0.0.0"
description = "Emit the AdCP SDK types from the schema bundle."
requires-python = ">=3.10"
dependencies = [
    # The harness grades a (JSON Schema document, Python class) pair. These four
    # are everything it imports, and the emitter adds nothing to them.
    "pydantic>=2.13.0,<2.14",
    "jsonschema>=4.20.0",
    # Pinned exactly. A hypothesis example stream is a function of the version:
    # the same control pair measured 30/40 at 6.98.0, 24 at 6.112.0, 25 at
    # 6.125.0, 28 at 6.140.0 and 6.168.5, 20 at 6.170.5. 6.169.0 raises the
    # floor to Python 3.11, above requires-python here.
    "hypothesis==6.168.5",
    "hypothesis-jsonschema==0.23.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[build-system]
# The emitted tree is a package, not a directory of files: the step-1 outcome is
# that `from adcp.types._schemas.core.pagination_request import PaginationRequest`
# works, and an uninstalled project makes that conditional on PYTHONPATH.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The binding table is not documentation of the build: `strict_validate` reads it
# at runtime to find the document that decides acceptance (D4). A wheel without
# it imports and then raises on the first validation, which is the one failure
# mode a test run from the source tree cannot see.
[tool.setuptools.package-data]
"adcp.types._schemas" = ["_bindings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
