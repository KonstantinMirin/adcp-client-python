# Pre-commit hooks for AdCP Python client
# See https://pre-commit.com for more information
# Installation: make bootstrap

repos:
  # Black code formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=100]
        # Generated and deterministically emitted trees are checked for EQUALITY with a
        # regeneration by make validate-generated; reformatting them makes the checked
        # output stale. The emitted tree is src/adcp/types/_schemas/ -- codegen/emit.py's
        # PACKAGE = "adcp.types._schemas" -- and this exclude named only domains/, which
        # today holds one hand-written compatibility mirror and no generated module.
        # Measured 2026-11-20: black would reformat 1,028 of _schemas/'s 1,094 files.
        exclude: ^(src/adcp/types/_schemas/|src/adcp/types/domains/|src/adcp/types/v(30|31|32)\.pyi$|src/adcp/types/versioned_bases/_?v(30|31|32)\.(py|pyi)$)

  # Ruff linting (ignoring line-length for now - black handles it)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore=E501]
        # _schemas/ for the black hook's reason, and more sharply: this hook carries
        # --fix, so it EDITS what it touches. Measured 2026-11-20: ruff reports 14,646
        # errors over the emitted tree and calls 176 of them auto-fixable, so an
        # unexcluded run writes 176 edits into a tree validate-generated then compares
        # against a regeneration that does not contain them.
        exclude: ^(src/adcp/types/_schemas/|src/adcp/types/domains/|src/adcp/types/versioned_bases/_?v(30|31|32)\.(py|pyi)$)

  # Mypy type checking (local hook to use project dependencies)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --extra dev mypy  # --extra dev ensures types-protobuf stubs are present
        language: system
        types: [python]
        pass_filenames: false
        args: [src/adcp]
      - id: adopter-type-checks
        name: adopter type-check fixtures
        entry: uv run --extra dev mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [--strict, tests/type_checks/]
      - id: adopter-type-ignore-contract
        name: "adopter type-check fixtures contain no type: ignore suppressions"
        entry: uv run python scripts/check_type_ignore_contract.py
        language: system
        types: [python]
        pass_filenames: false
      - id: check-commit-msg
        name: release-please commit subject check
        entry: scripts/check-commit-msg.sh
        language: script
        stages: [commit-msg]

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|scripts/|src/adcp/types/versioned_bases/_?v(30|31|32)\.(py|pyi)$)

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^schemas/
      - id: end-of-file-fixer
        exclude: ^schemas/
      - id: check-yaml
      - id: check-json
        exclude: ^schemas/
      - id: check-added-large-files
        args: [--maxkb=1000]
        # schemas/cache/ ships upstream-bundled, denormalized validator
        # schemas (e.g. v3.1+ bundled core/*-response.json files exceed
        # 6 MB). They're canonical from the protocol release tarball, not
        # hand-authored — the large-file gate would block every schema
        # sync. Version-scoped type stubs are also generated from those schema
        # bundles and validated byte-for-byte by make validate-generated.
        exclude: ^(schemas/|src/adcp/types/v(30|31|32)\.pyi$|src/adcp/types/versioned_bases/_?v(30|31|32)\.(py|pyi)$)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

# Configuration
default_language_version:
  python: python3.11

# Run hooks on all files during manual runs
fail_fast: false
